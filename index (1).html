  var $ = function(s){return R.querySelector(s)};
  var gbp = new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function iso(d){var m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day}
  function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
  function fmtDate(s){if(!s)return '';var d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
  function pad(n){return ('000'+n).slice(-4)}

  var DEFAULT_NOTES = {
    invoice:'Payment is due within 14 days. Thank you for your business.',
    quote:'This quote is valid for 30 days. Prices are based on the work described and may change if the job changes.'
  };
  var biz = {name:'Mahmood Property Services',phone:'',email:'',address:'',vatNo:'',pay:''};
  var counters = {invoice:0,quote:0};
  var today = iso(new Date());
  var doc = {type:'invoice',number:'',date:today,due:addDays(today,14),custName:'',custAddr:'',custId:'',
    items:[{d:'',t:'labour',q:1,p:''}],vat:false,cis:false,cisRate:'20',sfPct:'',
    notes:{invoice:DEFAULT_NOTES.invoice,quote:DEFAULT_NOTES.quote}};

  function load(){
    try{var b=JSON.parse(localStorage.getItem('mps_biz')||'null');if(b){for(var k in b){biz[k]=b[k]}}}catch(e){}
    try{var c=JSON.parse(localStorage.getItem('mps_counters')||'null');if(c){counters=c}}catch(e){}
  }
  function saveBiz(){try{localStorage.setItem('mps_biz',JSON.stringify(biz))}catch(e){}if(store.db){try{dbCol().doc('biz').set({b:JSON.parse(JSON.stringify(biz))}).catch(function(){})}catch(e){}}}
  function saveCounters(){try{localStorage.setItem('mps_counters',JSON.stringify(counters))}catch(e){}}
  function prefix(){return doc.type==='invoice'?'INV-':'QUO-'}
  function nextNumber(){return prefix()+pad((counters[doc.type]||0)+1)}

  function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
  function typeLabel(x){return x==='labour'?'Labour':(x==='supplyfit'?'Supply and fit':'Materials')}
  function calc(){
    var labour=0,mats=0,sf=0;
    doc.items.forEach(function(i){
      var a=num(i.q)*num(i.p);
      if(i.t==='labour')labour+=a;else if(i.t==='supplyfit')sf+=a;else mats+=a;
    });
    var sub=labour+mats+sf;
    var vat=doc.vat?sub*0.2:0;
    var pct=Math.min(100,Math.max(0,num(doc.sfPct)));
    var cisBase=labour+sf*pct/100;
    var cis=(doc.type==='invoice'&&doc.cis)?cisBase*num(doc.cisRate)/100:0;
    return {labour:labour,mats:mats,sf:sf,sub:sub,vat:vat,cis:cis,total:sub+vat-cis};
  }
  function updateSf(){
    var show=doc.type==='invoice'&&doc.cis&&doc.items.some(function(i){return i.t==='supplyfit'});
    var w=$('#sfWrap');if(w)w.style.display=show?'':'none';
  }
  function renderItems(){
    var h='';
    doc.items.forEach(function(it,i){
      h+='<div class="item" data-i="'+i+'">'+
        '<label class="f"><span>Description</span><input data-f="d" value="'+esc(it.d)+'" placeholder="e.g. Fit new kitchen door" autocomplete="off"></label>'+
        '<div class="grid">'+
          '<label class="f"><span>Type</span><select data-f="t"><option value="labour"'+(it.t==='labour'?' selected':'')+'>Labour</option><option value="materials"'+(it.t==='materials'?' selected':'')+'>Materials</option><option value="supplyfit"'+(it.t==='supplyfit'?' selected':'')+'>Supply and fit</option></select></label>'+
          '<label class="f"><span>Qty</span><input data-f="q" inputmode="decimal" value="'+esc(it.q)+'"></label>'+
          '<label class="f"><span>Price (£)</span><input data-f="p" inputmode="decimal" value="'+esc(it.p)+'" placeholder="0.00"></label>'+
          '<button type="button" class="del" data-del="'+i+'" aria-label="Remove item '+(i+1)+'">Remove</button>'+
        '</div></div>';
    });
    $('#items').innerHTML=h;
  }

  function renderPaper(){
    updateSf();
    var t=calc(), isInv=doc.type==='invoice';
    var rows='';
    doc.items.forEach(function(it){
      if(!it.d&&!num(it.p))return;
      var amt=num(it.q)*num(it.p);
      rows+='<tr><td>'+esc(it.d||'Item')+'<span class="tag">'+typeLabel(it.t)+'</span></td>'+
        '<td class="n">'+esc(it.q)+'</td><td class="n">'+gbp.format(num(it.p))+'</td><td class="n">'+gbp.format(amt)+'</td></tr>';
    });
    if(!rows)rows='<tr class="empty"><td colspan="4">Add your first item to see it here.</td></tr>';
    var tot='';
    var cats=(t.labour>0?1:0)+(t.mats>0?1:0)+(t.sf>0?1:0);
    if(cats>1){
      if(t.labour>0)tot+='<div><span>Labour</span><span>'+gbp.format(t.labour)+'</span></div>';
      if(t.mats>0)tot+='<div><span>Materials</span><span>'+gbp.format(t.mats)+'</span></div>';
      if(t.sf>0)tot+='<div><span>Supply and fit</span><span>'+gbp.format(t.sf)+'</span></div>';
    }
    tot+='<div><strong>Subtotal</strong><strong>'+gbp.format(t.sub)+'</strong></div>';
    if(doc.vat)tot+='<div><span>VAT at 20%</span><span>'+gbp.format(t.vat)+'</span></div>';
    if(isInv&&doc.cis)tot+='<div><span>CIS deduction ('+esc(doc.cisRate)+'% of labour)</span><span>−'+gbp.format(t.cis)+'</span></div>';
    tot+='<div class="due"><span>'+(isInv?'Total due':'Quote total')+'</span><span>'+gbp.format(t.total)+'</span></div>';

    var contact=[biz.address,biz.phone,biz.email,biz.vatNo?('VAT no. '+biz.vatNo):''].filter(Boolean).join('\n');
    var foot='';
    if(isInv&&biz.pay)foot+='<div><h3>Payment details</h3><p>'+esc(biz.pay)+'</p></div>';
    var notes=doc.notes[doc.type];
    if(notes)foot+='<div><h3>'+(isInv?'Notes':'Terms')+'</h3><p>'+esc(notes)+'</p></div>';

    $('#paper').innerHTML=
      '<div class="top"><img src="'+LOGO+'" alt="'+esc(biz.name)+'">'+
      '<div class="doc-title"><h1>'+(isInv?'Invoice':'Quote')+'</h1>'+
        '<p>'+esc(doc.number)+'</p><p>Date: '+esc(fmtDate(doc.date))+'</p>'+
        (doc.due?'<p>'+(isInv?'Due: ':'Valid until: ')+esc(fmtDate(doc.due))+'</p>':'')+'</div></div>'+
      '<div class="parties"><div><h3>From</h3><p><strong>'+esc(biz.name)+'</strong></p><p>'+esc(contact)+'</p></div>'+
      '<div><h3>'+(isInv?'Bill to':'Prepared for')+'</h3><p><strong>'+esc(doc.custName||'Customer name')+'</strong></p><p>'+esc(doc.custAddr)+'</p></div></div>'+
      '<table><thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="totals">'+tot+'</div>'+
      (foot?'<div class="foot">'+foot+'</div>':'')+
      '<div class="thanks">Thank you for choosing '+esc(biz.name)+'</div>';
  }

  function syncLabels(){
    var isInv=doc.type==='invoice';
    $('#tInvoice').setAttribute('aria-pressed',isInv);
    $('#tQuote').setAttribute('aria-pressed',!isInv);
    $('#docHead').textContent=isInv?'Invoice details':'Quote details';
    $('#numLbl').textContent=isInv?'Invoice number':'Quote number';
    $('#dueLbl').textContent=isInv?'Payment due date':'Quote valid until';
    $('#notesLbl').textContent=isInv?'Notes':'Terms';
    $('#cisBox').style.display=isInv?'':'none';
    $('#cisRateWrap').style.display=(isInv&&doc.cis)?'':'none';
    $('#notes').value=doc.notes[doc.type];
  }

  function fillFields(){
    R.querySelectorAll('[data-s]').forEach(function(el){
      var src=el.dataset.s==='biz'?biz:doc, v=src[el.dataset.k];
      if(el.type==='checkbox')el.checked=!!v;else el.value=(v==null?'':v);
    });
  }

  function refresh(){syncLabels();renderPaper();updateLive()}
  function updateLive(){}

  // events
  R.addEventListener('input',function(e){
    var el=e.target;
    if(el.id==='notes'){doc.notes[doc.type]=el.value;renderPaper();return}
    if(el.dataset&&el.dataset.s){
      var v=el.type==='checkbox'?el.checked:el.value;
      if(el.dataset.s==='biz'){biz[el.dataset.k]=v;saveBiz()}else doc[el.dataset.k]=v;
      if(el.dataset.k==='cis')syncLabels();
      renderPaper();return;
    }
    var row=el.closest&&el.closest('.item');
    if(row&&el.dataset.f){doc.items[+row.dataset.i][el.dataset.f]=el.value;renderPaper()}
  });
  R.addEventListener('change',function(e){
    var el=e.target;
    if(el.dataset&&el.dataset.s&&el.type==='checkbox'){doc[el.dataset.k]=el.checked;syncLabels();renderPaper()}
  });
  $('#items').addEventListener('click',function(e){
    var b=e.target.closest('[data-del]');if(!b)return;
    doc.items.splice(+b.dataset.del,1);
    if(!doc.items.length)doc.items.push({d:'',t:'labour',q:1,p:''});
    renderItems();renderPaper();
  });
  $('#addItem').addEventListener('click',function(){
    doc.items.push({d:'',t:'labour',q:1,p:''});renderItems();renderPaper();
    var inputs=R.querySelectorAll('#items .item:last-child input');if(inputs[0])inputs[0].focus();
  });

  function setType(t){
    if(doc.type===t)return;
    doc.type=t;
    doc.number=nextNumber();
    doc.due=addDays(doc.date,t==='invoice'?14:30);
    fillFields();refresh();
  }
  $('#tInvoice').addEventListener('click',function(){setType('invoice')});
  $('#tQuote').addEventListener('click',function(){setType('quote')});

  function setView(v){
    RB.setAttribute('data-view',v);
    $('#vEdit').setAttribute('aria-pressed',v==='edit');
    $('#vPrev').setAttribute('aria-pressed',v==='preview');
    window.scrollTo(0,0);
  }
  $('#vEdit').addEventListener('click',function(){setView('edit')});
  $('#vPrev').addEventListener('click',function(){setView('preview')});
  $('#toPrev').addEventListener('click',function(){setView('preview')});
  $('#backEdit').addEventListener('click',function(){setView('edit')});

  function say(t){$('#msg').textContent=t}
  function markUsed(){var m=/(\d+)$/.exec(doc.number||'');if(m){counters[doc.type]=Math.max(counters[doc.type]||0,parseInt(m[1],10));saveCounters()}}
  function fname(){
    var base=(doc.type==='invoice'?'Invoice-':'Quote-')+(doc.number||'draft');
    var c=(doc.custName||'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
    return base+(c?'-'+c:'')+'.pdf';
  }
  function money(n){return gbp.format(n).replace(/\u2212/g,'-')}

  function buildPdf(){
    var J=window.jspdf&&window.jspdf.jsPDF; if(!J)return null;
    var p=new J({unit:'mm',format:'a4'});
    var M=15,R=195,y,isInv=doc.type==='invoice',t=calc();
    var GOLD=[195,154,45],CH=[88,89,91],INK=[34,34,34],GREY=[120,120,120];
    function col(c){p.setTextColor(c[0],c[1],c[2])}
    function font(w,s,c){p.setFont('helvetica',w);p.setFontSize(s);col(c)}
    p.addImage(LOGO,'PNG',M,14,45.5,20);
    font('bold',26,CH);p.text(isInv?'Invoice':'Quote',R,24,{align:'right'});
    font('normal',10,INK);
    var yy=30;p.text(doc.number||'',R,yy,{align:'right'});
    yy+=5;p.text('Date: '+fmtDate(doc.date),R,yy,{align:'right'});
    if(doc.due){yy+=5;p.text((isInv?'Due: ':'Valid until: ')+fmtDate(doc.due),R,yy,{align:'right'})}
    p.setFillColor(GOLD[0],GOLD[1],GOLD[2]);p.rect(M,42,R-M,1.2,'F');

    function party(title,name,body,x){
      font('bold',11,CH);p.text(title,x,52);
      font('bold',11,INK);p.text(name,x,58);
      font('normal',10,INK);
      var lines=p.splitTextToSize(body||'',80);
      if(lines.length&&lines[0])p.text(lines,x,63.5);
      return 63.5+lines.length*4.6;
    }
    var contact=[biz.address,biz.phone,biz.email,biz.vatNo?('VAT no. '+biz.vatNo):''].filter(Boolean).join('\n');
    var y1=party('From',biz.name||'',contact,M);
    var y2=party(isInv?'Bill to':'Prepared for',doc.custName||'Customer name',doc.custAddr||'',110);
    y=Math.max(y1,y2)+6;

    function head(){
      p.setFillColor(CH[0],CH[1],CH[2]);p.rect(M,y,R-M,8,'F');
      font('bold',10,[255,255,255]);
      p.text('Description',M+2,y+5.4);p.text('Qty',135,y+5.4,{align:'right'});
      p.text('Price',165,y+5.4,{align:'right'});p.text('Amount',R-2,y+5.4,{align:'right'});
      y+=8;
    }
    head();
    var any=false;
    doc.items.forEach(function(it){
      if(!it.d&&!num(it.p))return;
      any=true;
      var lines=p.splitTextToSize(it.d||'Item',95);
      var h=lines.length*4.6+9;
      if(y+h>272){p.addPage();y=20;head()}
      font('normal',10,INK);p.text(lines,M+2,y+5.4);
      font('normal',8,GREY);p.text(typeLabel(it.t),M+2,y+lines.length*4.6+4.6);
      font('normal',10,INK);
      p.text(String(it.q),135,y+5.4,{align:'right'});
      p.text(money(num(it.p)),165,y+5.4,{align:'right'});
      p.text(money(num(it.q)*num(it.p)),R-2,y+5.4,{align:'right'});
      p.setDrawColor(228,226,220);p.line(M,y+h,R,y+h);
      y+=h;
    });
    if(!any){font('normal',10,GREY);p.text('No items added',M+2,y+7);y+=12}

    y+=6;if(y>235){p.addPage();y=20}
    function trow(label,val,bold){
      font(bold?'bold':'normal',10,INK);
      p.text(label,125,y);p.text(val,R-2,y,{align:'right'});y+=6;
    }
    var cats=(t.labour>0?1:0)+(t.mats>0?1:0)+(t.sf>0?1:0);
    if(cats>1){
      if(t.labour>0)trow('Labour',money(t.labour));
      if(t.mats>0)trow('Materials',money(t.mats));
      if(t.sf>0)trow('Supply and fit',money(t.sf));
    }
    trow('Subtotal',money(t.sub),true);
    if(doc.vat)trow('VAT at 20%',money(t.vat));
    if(isInv&&doc.cis)trow('CIS deduction ('+doc.cisRate+'% of labour)','-'+money(t.cis));
    y+=1;
    p.setFillColor(GOLD[0],GOLD[1],GOLD[2]);p.rect(125,y,R-125,10,'F');
    font('bold',13,INK);p.text(isInv?'Total due':'Quote total',127,y+7);
    p.text(money(t.total),R-2,y+7,{align:'right'});
    y+=20;

    var notes=doc.notes[doc.type];
    var showPay=isInv&&biz.pay;
    var pl=showPay?p.splitTextToSize(biz.pay,85):[];
    var nl=notes?p.splitTextToSize(notes,85):[];
    var need=Math.max(pl.length,nl.length)*4.6+22;
    if(y+need>285){p.addPage();y=20}
    if(showPay){font('bold',11,CH);p.text('Payment details',M,y);font('normal',10,INK);p.text(pl,M,y+6)}
    if(notes){font('bold',11,CH);p.text(isInv?'Notes':'Terms',110,y);font('normal',10,INK);p.text(nl,110,y+6)}
    y+=Math.max(pl.length,nl.length)*4.6+16;
    if(y>285){p.addPage();y=20}
    p.setDrawColor(228,226,220);p.line(M,y-6,R,y-6);
    font('bold',11,CH);p.text('Thank you for choosing '+(biz.name||'us'),105,y,{align:'center'});
    return p;
  }

  async function makePdfBlob(){
    var p=buildPdf();
    if(!p){say('The PDF tool did not load. Check your connection and try again.');return null}
    return p.output('blob');
  }
  $('#savePdf').addEventListener('click',async function(){
    say('Making your PDF…');
    saveRecord();
    var blob=await makePdfBlob();if(!blob)return;
    var res=await window.MPS.saveFile(fname(),blob);
    if(res==='saved'){markUsed();say('PDF saved. Find it in your downloads or files, then send it to your customer from there.')}
    else if(res==='declined')say('Cancelled, nothing was saved.');
    else say('Could not save the PDF. Tap "Screenshot view" instead.');
  });
  // ---- History of past invoices and quotes ----
  var hist=[],store={db:null,uid:null},pendingDel=null;
  function recId(){return (doc.type==='invoice'?'inv':'quo')+'_'+String(doc.number||'draft').replace(/[^A-Za-z0-9]+/g,'-')}
  function hasContent(){return !!doc.custName||doc.items.some(function(i){return i.d||num(i.p)})}
  function persistLocal(){try{localStorage.setItem('mps_hist',JSON.stringify(hist))}catch(e){}}
  function bumpCounters(){
    hist.forEach(function(r){
      var m=/(\d+)$/.exec(r.number||'');
      if(m&&counters[r.type]!==undefined){counters[r.type]=Math.max(counters[r.type]||0,parseInt(m[1],10))}
    });
    saveCounters();
  }
  function loadHist(){
    try{var h=JSON.parse(localStorage.getItem('mps_hist')||'[]');if(Array.isArray(h))hist=h}catch(e){hist=[]}
    bumpCounters();
  }
  function dbCol(){return store.db.collection('data/users/'+store.uid)}
  function makeRecord(){
    var t=calc();
    var prev=hist.filter(function(r){return r.id===recId()})[0];
    return {id:recId(),type:doc.type,number:doc.number||'',date:doc.date||'',due:doc.due||'',
      custName:doc.custName||'',custAddr:doc.custAddr||'',custId:doc.custId||'',
      items:JSON.parse(JSON.stringify(doc.items)),vat:!!doc.vat,cis:!!doc.cis,cisRate:String(doc.cisRate),sfPct:String(doc.sfPct||''),
      notes:doc.notes[doc.type]||'',total:t.total,paid:prev?!!prev.paid:false,savedAt:Date.now()};
  }
  function saveRecord(){
    if(!hasContent())return;
    var r=makeRecord();
    var i=-1;hist.forEach(function(x,n){if(x.id===r.id)i=n});
    if(i>=0)hist[i]=r;else hist.push(r);
    persistLocal();
    if(store.db){try{dbCol().doc(r.id).set(r).catch(function(){})}catch(e){}}
  }
  async function initStore(){
    try{
      if(!window.claude)return;
      var u=await window.claude.use('user'),d=await window.claude.use('db');
      if(!u||!d)return;
      var id=await u.id();if(!id)return;
      store.db=d;store.uid=id;
      var snap=await dbCol().get();
      var have={};
      snap.docs.forEach(function(s){
        var sid=String(s.id);
        if(sid.indexOf('inv_')!==0&&sid.indexOf('quo_')!==0&&sid!=='biz')return;
        var r=JSON.parse(JSON.stringify(s.data()||{}));
        if(sid==='biz'){
          var bl=null;try{bl=localStorage.getItem('mps_biz')}catch(e){}
          if(!bl&&r.b){for(var bk in r.b){biz[bk]=r.b[bk]}saveBiz();fillFields();renderPaper()}
          return;
        }
        if(!r.id)return;
        have[r.id]=true;
        var i=-1;hist.forEach(function(x,n){if(x.id===r.id)i=n});
        if(i<0)hist.push(r);else if((r.savedAt||0)>(hist[i].savedAt||0))hist[i]=r;
      });
      hist.forEach(function(r){if(!have[r.id]){try{dbCol().doc(r.id).set(r).catch(function(){})}catch(e){}}});
      persistLocal();bumpCounters();
      try{if(localStorage.getItem('mps_biz'))saveBiz()}catch(e){}
      if(!hasContent()){doc.number=nextNumber();fillFields();renderPaper()}
      if(!$('#hist').hidden)renderHist();
    }catch(e){}
  }
  function renderHist(){
    var q=($('#histQ').value||'').toLowerCase();
    var list=hist.slice().sort(function(a,b){return (b.savedAt||0)-(a.savedAt||0)}).filter(function(r){
      return !q||((r.number||'')+' '+(r.custName||'')).toLowerCase().indexOf(q)>=0});
    var owed=0;hist.forEach(function(r){if(r.type==='invoice'&&!r.paid)owed+=(r.total||0)});
    $('#histSum').textContent=hist.length?('Unpaid invoices: '+gbp.format(owed)):'';
    if(!list.length){
      $('#histList').innerHTML='<p class="hint">'+(hist.length?'No matches.':'Nothing saved yet. Each invoice or quote is saved when you tap Screenshot view or Save as PDF, or Start a new one.')+'</p>';
      return;
    }
    $('#histList').innerHTML=list.map(function(r){
      var inv=r.type==='invoice';
      var status=inv?(r.paid?', paid':', unpaid'):'';
      return '<div class="hrow" data-id="'+esc(r.id)+'">'+
        '<div class="hmain"><strong>'+esc(r.number)+'</strong> '+esc(r.custName||'No customer name')+
        '<div class="hint">'+(inv?'Invoice':'Quote')+', '+esc(fmtDate(r.date))+status+'</div></div>'+
        '<div class="htot">'+gbp.format(r.total||0)+'</div>'+
        '<div class="hbtns"><button type="button" data-a="open">Open</button>'+
        (inv?'<button type="button" data-a="paid">'+(r.paid?'Mark unpaid':'Mark paid')+'</button>':'')+
        '<button type="button" data-a="del">'+(pendingDel===r.id?'Tap again to delete':'Delete')+'</button></div></div>';
    }).join('');
  }
  function openHist(){saveRecord();pendingDel=null;$('#histQ').value='';renderHist();$('#hist').hidden=false;$('#hist').scrollTop=0}
  function closeHist(){$('#hist').hidden=true}
  $('#histBtn').addEventListener('click',openHist);
  $('#histClose').addEventListener('click',closeHist);
  $('#histQ').addEventListener('input',renderHist);
  $('#histList').addEventListener('click',function(e){
    var b=e.target.closest('button[data-a]');if(!b)return;
    var id=b.closest('.hrow').dataset.id,r=null,idx=-1;
    hist.forEach(function(x,n){if(x.id===id){r=x;idx=n}});
    if(!r)return;
    var a=b.dataset.a;
    if(a==='open'){
      saveRecord();
      doc.type=r.type;doc.number=r.number;doc.date=r.date;doc.due=r.due;
      doc.custName=r.custName;doc.custAddr=r.custAddr;doc.custId=r.custId||'';
      doc.items=JSON.parse(JSON.stringify(r.items));
      doc.vat=!!r.vat;doc.cis=!!r.cis;doc.cisRate=String(r.cisRate||'20');doc.sfPct=String(r.sfPct||'');
      doc.notes[r.type]=r.notes||'';
      fillFields();renderItems();refresh();closeHist();setView('preview');
    }else if(a==='paid'){
      r.paid=!r.paid;persistLocal();
      if(store.db){try{dbCol().doc(r.id).set(r).catch(function(){})}catch(err){}}
      renderHist();
    }else if(a==='del'){
      if(pendingDel!==id){pendingDel=id;renderHist();return}
      hist.splice(idx,1);pendingDel=null;persistLocal();
      if(store.db){try{dbCol().doc(id).delete().catch(function(){})}catch(err){}}
      renderHist();
    }
  });

  // Screenshot view: shows only the invoice, scaled to fit the screen

  window.MPS.getInvoices=function(){return hist};
  (function(){

  R.addEventListener('focusin',function(e){

      $('#custNames').innerHTML=cs.map(function(c){return '<option value="'+esc(c.name)+'">'}).join('');
    }
  });

  window.MPS.openHistory=function(){openHist()};
  load();

});
MODS.exp=(function(R,RB){
  var $=function(s){return R.querySelector(s)};
  var gbp=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
  var CATS=['Materials','Tools and equipment','Fuel and travel','Van costs','Insurance','Phone and software','Subcontractors','Advertising','Other'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function num(v){var n=parseFloat(String(v).replace(/[£,\s]/g,''));return isNaN(n)?0:n}
  function taxYearOf(s){var y=+s.slice(0,4),md=s.slice(5);return md>='04-06'?y:y-1}
  function tyLabel(y){return y+'/'+String((y+1)%100).padStart(2,'0')}
  function dayLabel(s){var d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
  function monthLabel(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}

  var today=iso(new Date());
  var data=[],store={db:null,uid:null},editing=null,photo='';

  // ---------- storage ----------
  function persistLocal(){
    try{localStorage.setItem('mps_exp',JSON.stringify(data))}
    catch(e){
      try{localStorage.setItem('mps_exp',JSON.stringify(data.map(function(r){var c={};for(var k in r)c[k]=r[k];c.photo='';return c})))}catch(e2){}
    }
  }
  function loadLocal(){try{var d=JSON.parse(localStorage.getItem('mps_exp')||'[]');if(Array.isArray(d))data=d}catch(e){data=[]}}
  function col(){return store.db.collection('data/users/'+store.uid)}
  function putDb(r){if(store.db){try{col().doc(r.id).set(r).catch(function(){})}catch(e){}}}
  function delDb(id){if(store.db){try{col().doc(id).delete().catch(function(){})}catch(e){}}}
  async function initStore(){
    try{
      if(!window.claude)return;
      var u=await window.claude.use('user'),d=await window.claude.use('db');
      if(!u||!d)return;
      var id=await u.id();if(!id)return;
      store.db=d;store.uid=id;
      var snap=await col().get(),have={};
      snap.docs.forEach(function(s){
        if(String(s.id).indexOf('e_')!==0)return;
        var r=JSON.parse(JSON.stringify(s.data()||{}));if(!r.id)return;
        have[r.id]=true;
        var i=-1;data.forEach(function(x,n){if(x.id===r.id)i=n});
        if(i<0)data.push(r);else if((r.savedAt||0)>(data[i].savedAt||0))data[i]=r;
      });
      data.forEach(function(r){if(!have[r.id])putDb(r)});
      persistLocal();render();
    }catch(e){}
  }

  // ---------- derived ----------
  function years(){
    var cur=taxYearOf(today),set={};set[cur]=1;set[cur-1]=1;
    data.forEach(function(r){set[taxYearOf(r.date)]=1});
    return Object.keys(set).map(Number).sort(function(a,b){return b-a});
  }
  function selYear(){var v=$('#taxYear').value;return v?+v:taxYearOf(today)}
  function sum(list){return list.reduce(function(s,r){return s+(r.amount||0)},0)}
  function inYear(y){return data.filter(function(r){return taxYearOf(r.date)===y})}
  function shown(){
    var y=selYear(),c=$('#fCat').value,q=($('#fQ').value||'').toLowerCase();
    return inYear(y).filter(function(r){
      if(c&&r.cat!==c)return false;
      if(q&&((r.job||'')+' '+(r.note||'')+' '+r.cat).toLowerCase().indexOf(q)<0)return false;
      return true;
    }).sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(b.savedAt||0)-(a.savedAt||0))});
  }

  // ---------- render ----------
  function fillSelects(){
    var ys=years(),cur=$('#taxYear').value;
    $('#taxYear').innerHTML=ys.map(function(y){return '<option value="'+y+'">'+tyLabel(y)+'</option>'}).join('');
    $('#taxYear').value=cur&&ys.indexOf(+cur)>=0?cur:String(taxYearOf(today));
    if(!$('#fCat').options.length){
      $('#fCat').innerHTML='<option value="">All categories</option>'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('');
      $('#eCat').innerHTML=CATS.map(function(c){return '<option>'+c+'</option>'}).join('');
    }
    var jobs={};data.forEach(function(r){if(r.job)jobs[r.job]=1});
    $('#jobs').innerHTML=Object.keys(jobs).sort().map(function(j){return '<option value="'+esc(j)+'">'}).join('');
  }
  function render(){
    fillSelects();
    var y=selYear(),yr=inYear(y);
    var mk=today.slice(0,7);
    var mt=sum(data.filter(function(r){return r.date.slice(0,7)===mk}));
    $('#monthLbl').textContent=new Date().toLocaleDateString('en-GB',{month:'long'});
    $('#monthVal').textContent=gbp.format(mt);
    $('#yearLbl').textContent='Tax year '+tyLabel(y);
    $('#yearVal').textContent=gbp.format(sum(yr));

    var by={};yr.forEach(function(r){by[r.cat]=(by[r.cat]||0)+(r.amount||0)});
    var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),max=cats.length?by[cats[0]]:0;
    $('#bars').innerHTML=cats.length?cats.map(function(c){
      return '<div class="b"><div class="t"><span>'+esc(c)+'</span><strong>'+gbp.format(by[c])+'</strong></div><div class="track"><div class="fill" style="width:'+Math.max(2,Math.round(by[c]/max*100))+'%"></div></div></div>';
    }).join(''):'<p class="empty" style="padding:0">Nothing recorded for this tax year yet.</p>';

    var list=shown(),h='',cm='';
    if(!list.length){
      h='<p class="empty">'+(yr.length?'No expenses match.':'Tap Add expense to record your first one.')+'</p>';
    }else{
      var months={};list.forEach(function(r){var k=r.date.slice(0,7);months[k]=(months[k]||0)+(r.amount||0)});
      list.forEach(function(r){
        var k=r.date.slice(0,7);
        if(k!==cm){cm=k;h+='<div class="month"><h3>'+esc(monthLabel(k))+'</h3><span>'+gbp.format(months[k])+'</span></div>'}
        var sub=[r.cat,r.job].filter(Boolean).join(', ');
        h+='<button type="button" class="ex" data-id="'+esc(r.id)+'"><span class="d">'+esc(dayLabel(r.date))+'</span>'+
          '<span class="m"><strong>'+esc(r.note||r.cat)+'</strong><small>'+esc(sub)+(r.photo?', receipt saved':'')+'</small></span>'+
          '<span class="a">'+gbp.format(r.amount||0)+'</span></button>';
      });
    }
    $('#list').innerHTML=h;
  }

  // ---------- sheet ----------
  function showPhoto(){
    $('#photoBox').innerHTML=photo?('<img class="thumb" alt="Receipt" src="'+photo+'"><button type="button" class="btn ghost" id="rmPhoto">Remove photo</button>'):'';
  }
  function openSheet(r){
    editing=r?r.id:null;
    $('#sheetTitle').textContent=r?'Edit expense':'Add expense';
    $('#eDate').value=r?r.date:today;
    $('#eAmt').value=r?String(r.amount):'';
    $('#eCat').value=r?r.cat:CATS[0];
    $('#eJob').value=r?(r.job||''):'';
    $('#eNote').value=r?(r.note||''):'';
    $('#ePhoto').value='';$('#ePhotoCam').value='';stopCam();
    photo=r?(r.photo||''):'';
    showPhoto();
    $('#eErr').textContent='';
    $('#eDel').hidden=!r;$('#eDel').textContent='Delete';
    $('#sheet').hidden=false;$('#sheet').scrollTop=0;
    if(!r)setTimeout(function(){$('#eAmt').focus()},50);

  function applySnap(it){
    var T=TYPES[it.type];

      var d={left:it.cx,right:plan.W-it.cx,top:it.cy,bottom:plan.D-it.cy},min='top';

    }

    v3Draw();
  }
  function closeV3(){V.on=false;$('#v3').hidden=true}
  $('#v3Btn').addEventListener('click',openV3);
  $('#v3Close').addEventListener('click',function(e){e.stopPropagation();closeV3()});
  $('#v3Hide').addEventListener('click',function(e){e.stopPropagation();V.barOn=false;$('#v3bar').hidden=true});
  $('#v3Corner').addEventListener('click',function(){v3View('corner');v3Schedule()});
  $('#v3Front').addEventListener('click',function(){v3View('front');v3Schedule()});
  $('#v3Top').addEventListener('click',function(){v3View('top');v3Schedule()});
  $('#v3In').addEventListener('click',function(){if(V.mode==='inside')V.ifov=clamp(V.ifov*0.85,0.6,1.9);else V.dist=clamp(V.dist*0.82,1200,60000);v3Schedule()});
  $('#v3Out').addEventListener('click',function(){if(V.mode==='inside')V.ifov=clamp(V.ifov*1.18,0.6,1.9);else V.dist=clamp(V.dist*1.22,1200,60000);v3Schedule()});
  $('#v3Inside').addEventListener('click',function(){v3View('inside');v3Schedule()});
  $('#v3wall').addEventListener('change',function(){V.showWall=this.checked;v3Schedule()});
  function walk(fw,st){
    var s=Math.sin(V.iyaw),c=Math.cos(V.iyaw);
    V.ix=clamp(V.ix+s*fw+c*st,150,plan.W-150);V.iz=clamp(V.iz-c*fw+s*st,150,plan.D-150);v3Schedule();
  }
  $('#wF').addEventListener('click',function(){walk(300,0)});
  $('#wB').addEventListener('click',function(){walk(-300,0)});
  $('#wL').addEventListener('click',function(){walk(0,-300)});
  $('#wR').addEventListener('click',function(){walk(0,300)});

  var SW={
    floor:['#DCD5C5','#AEB1B5','#4A4D52','#B98E5A','#D8BE92','#ECEBE7'],
    wall:['#EFEBE2','#F6F6F4','#D5D7DA','#C3CDBB','#C9D6E0','#F0E2BF','#34435C'],
    ceil:['#F8F8F6','#F1ECDF','#DADCDF'],
    cup:['#E8DDC2','#F2F2EF','#BDBFC2','#55585C','#2F3E5A','#A8B5A0','#3F5B47','#222325'],
    work:['#5B5D60','#2A2B2D','#E6E4DF','#B58B55','#6B4A2F','#BFB8AA','#8B8D90']
  };
  var CATN={floor:'Floor',wall:'Walls',ceil:'Ceiling',cup:'Cupboards',work:'Worktop'},curCat='cup';
  function renderCol(){
    var F=fin(),h='<div class="cats">';
    Object.keys(CATN).forEach(function(k){h+='<button type="button" class="catb" data-cat="'+k+'" aria-pressed="'+(k===curCat)+'">'+CATN[k]+'</button>'});
    h+='</div><div class="sws">';
    SW[curCat].forEach(function(c){h+='<button type="button" class="sw" data-col="'+c+'" aria-label="Colour '+c+'" aria-pressed="'+(F[curCat].toLowerCase()===c.toLowerCase())+'" style="background:'+c+'"></button>'});
    h+='<label class="cust">Custom<input type="color" id="v3Custom" value="'+F[curCat]+'"></label></div>';
    if(curCat==='cup')h+='<div class="cats"><button type="button" class="catb" data-gloss="0" aria-pressed="'+(!F.gloss)+'">Matt</button><button type="button" class="catb" data-gloss="1" aria-pressed="'+F.gloss+'">Gloss</button></div>';
    if(curCat==='ceil')h+='<label class="ckl"><input type="checkbox" id="v3ceil"'+(F.ceilOn?' checked':'')+'> Show ceiling (visible in the Inside view)</label>';
    $('#v3col').innerHTML=h;
  }
  $('#v3ColBtn').addEventListener('click',function(){
    V.colOpen=!V.colOpen;$('#v3col').hidden=!V.colOpen;$('#v3hint').hidden=V.colOpen;
    this.setAttribute('aria-pressed',V.colOpen);
    if(V.colOpen)renderCol();
  });
  $('#v3col').addEventListener('click',function(e){
    var F=fin(),b=e.target.closest('button');if(!b)return;
    if(b.dataset.cat){curCat=b.dataset.cat;renderCol();return}
    if(b.dataset.col){F[curCat]=b.dataset.col;save();renderCol();v3Schedule();return}
    if(b.dataset.gloss!==undefined){F.gloss=b.dataset.gloss==='1';save();renderCol();v3Schedule()}
  });
  $('#v3col').addEventListener('input',function(e){
    var F=fin();
    if(e.target.id==='v3Custom'){F[curCat]=e.target.value;save();v3Schedule()}
    if(e.target.id==='v3ceil'){F.ceilOn=e.target.checked;save();v3Schedule()}
  });
  function pinchD(){var k=Object.keys(V.pts);if(k.length<2)return 0;var a=V.pts[k[0]],b=V.pts[k[1]];return Math.hypot(a.x-b.x,a.y-b.y)}
  cv.addEventListener('pointerdown',function(e){
    try{cv.setPointerCapture(e.pointerId)}catch(x){}
    V.pts[e.pointerId]={x:e.clientX,y:e.clientY};V.moved=false;V.pinch=pinchD();
  });
  cv.addEventListener('pointermove',function(e){
    var p=V.pts[e.pointerId];if(!p)return;
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    var n=Object.keys(V.pts).length;
    if(Math.abs(dx)+Math.abs(dy)>1)V.moved=true;
    if(V.mode==='inside'){
      if(n===1){V.iyaw-=dx*0.006;V.ip=clamp(V.ip+dy*0.005,-0.9,0.9)}
      else if(n>=2){var d2=pinchD();if(V.pinch&&d2)V.ifov=clamp(V.ifov*V.pinch/d2,0.6,1.9);V.pinch=d2}
    }else if(n===1){V.yaw-=dx*0.008;V.pitch=clamp(V.pitch+dy*0.006,0.05,1.5)}
    else if(n>=2){var d=pinchD();if(V.pinch&&d)V.dist=clamp(V.dist*V.pinch/d,1200,60000);V.pinch=d}
    v3Schedule();
  });
  function v3Up(e){
    delete V.pts[e.pointerId];V.pinch=0;
    if(!V.moved&&!V.barOn&&!Object.keys(V.pts).length){V.barOn=true;$('#v3bar').hidden=false}
  }
  cv.addEventListener('pointerup',v3Up);
  cv.addEventListener('pointercancel',v3Up);
  cv.addEventListener('wheel',function(e){e.preventDefault();if(V.mode==='inside')V.ifov=clamp(V.ifov*(1+e.deltaY*0.001),0.6,1.9);else V.dist=clamp(V.dist*(1+e.deltaY*0.001),1200,60000);v3Schedule()},{passive:false});
  window.addEventListener('resize',function(){if(V.on){v3Size();v3Schedule()}});

  // ----- Saved designs (like the history in the invoice app) -----
  var pendingDsgDel=null;
  function hasWork(){return !!(plan.items.length||plan.name)}
  function persistDesigns(){try{localStorage.setItem('mps_kdesigns',JSON.stringify(designs))}catch(e){}}
  function loadDesigns(){try{var d=JSON.parse(localStorage.getItem('mps_kdesigns')||'[]');if(Array.isArray(d))designs=d}catch(e){designs=[]}}
  function dcol(){return store.db.collection('data/users/'+store.uid)}
  function putDesign(r){if(store.db){try{dcol().doc(r.id).set(r).catch(function(){})}catch(e){}}}
  function newDesignId(){return 'dz_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function upsertDesign(create){
    if(!hasWork())return null;
    if(!plan.designId){if(!create)return null;plan.designId=newDesignId()}
    var rec={id:plan.designId,name:plan.name||'Untitled kitchen',savedAt:Date.now(),plan:JSON.parse(JSON.stringify(plan))};
    var i=-1;designs.forEach(function(d,n){if(d.id===rec.id)i=n});
    if(i>=0)designs[i]=rec;else designs.push(rec);
    persistDesigns();putDesign(rec);
    return rec;
  }
  function thumbSvg(rec){
    var keep=plan,keepLayer=layer,out='';
    try{
      plan=rec.plan;layer='all';
      var vw=plan.W+2*MARGIN,vh=plan.D+2*MARGIN;
      out='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+(-MARGIN)+' '+(-MARGIN)+' '+vw+' '+vh+'" style="display:block;width:100%;height:auto;background:#fff;border-radius:6px">'+planInner({interactive:false}).svg+'</svg>';
    }catch(e){out=''}
    plan=keep;layer=keepLayer;
    return out;
  }
  function dateTxt(ms){return new Date(ms).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
  function renderDesigns(){
    var q=($('#dsgQ').value||'').toLowerCase();
    var list=designs.slice().sort(function(a,b){return (b.savedAt||0)-(a.savedAt||0)}).filter(function(d){return !q||(d.name||'').toLowerCase().indexOf(q)>=0});
    if(!list.length){
      $('#dsgList').innerHTML='<p class="hint">'+(designs.length?'No matches.':'No saved designs yet. Tap Save current design to keep this kitchen.')+'</p>';
      return;
    }
    $('#dsgList').innerHTML=list.map(function(d){
      var p=d.plan||{},cur=plan.designId===d.id;
      return '<div class="drow" data-id="'+esc(d.id)+'"><div class="dth">'+thumbSvg(d)+'</div>'+
        '<div class="dmain"><strong>'+esc(d.name||'Untitled kitchen')+'</strong>'+(cur?' <span class="badge">Open now</span>':'')+
        '<div class="hint">'+rnd(p.W||0)+' x '+rnd(p.D||0)+' mm, '+((p.items||[]).length)+' items</div>'+
        '<div class="hint">Saved '+esc(dateTxt(d.savedAt||Date.now()))+'</div></div>'+
        '<div class="dbtns"><button type="button" data-a="open">Open</button><button type="button" data-a="dup">Duplicate</button>'+
        '<button type="button" data-a="del">'+(pendingDsgDel===d.id?'Tap again to delete':'Delete')+'</button></div></div>';
    }).join('');
  }
  function dsgSay(t){$('#dsgMsg').textContent=t}
  function openDesigns(){
    upsertDesign(true);
    pendingDsgDel=null;$('#dsgQ').value='';dsgSay('');renderDesigns();
    $('#dsg').hidden=false;$('#dsg').scrollTop=0;
  }
  function closeDesigns(){$('#dsg').hidden=true}
  function loadPlanFrom(rec){
    plan=JSON.parse(JSON.stringify(rec.plan));plan.designId=rec.id;
    plan.items=plan.items||[];plan.autoTurn=plan.autoTurn!==false;
    sel=null;past=[];zoom=1;
    syncRoomFields();renderAll();save();
  }
  $('#dsgBtn').addEventListener('click',openDesigns);
  $('#dsgClose').addEventListener('click',closeDesigns);
  $('#dsgQ').addEventListener('input',renderDesigns);
  $('#dsgSave').addEventListener('click',function(){
    if(!hasWork()){dsgSay('Add some units or a project name first.');return}
    var r=upsertDesign(true);save();renderDesigns();
    dsgSay('Saved as "'+r.name+'".');
  });
  $('#dsgNew').addEventListener('click',function(){
    upsertDesign(true);
    checkpoint();
    plan={name:'',W:plan.W,D:plan.D,items:[],autoTurn:plan.autoTurn,finish:plan.finish};sel=null;past=[];
    syncRoomFields();renderAll();save();closeDesigns();
  });
  $('#dsgList').addEventListener('click',function(e){
    var b=e.target.closest('button[data-a]');if(!b)return;
    var id=b.closest('.drow').dataset.id,rec=null,idx=-1;
    designs.forEach(function(d,n){if(d.id===id){rec=d;idx=n}});
    if(!rec)return;
    var a=b.dataset.a;
    if(a==='open'){
      if(plan.designId!==id)upsertDesign(true);
      loadPlanFrom(rec);closeDesigns();
    }else if(a==='dup'){
      var c=JSON.parse(JSON.stringify(rec));c.id=newDesignId();c.name=(rec.name||'Untitled kitchen')+' (copy)';
      c.plan.name=c.name;c.plan.designId=c.id;c.savedAt=Date.now();
      designs.push(c);persistDesigns();putDesign(c);renderDesigns();dsgSay('Copied. Open the copy to try a different layout or colours.');
    }else if(a==='del'){
      if(pendingDsgDel!==id){pendingDsgDel=id;renderDesigns();return}
      designs.splice(idx,1);pendingDsgDel=null;persistDesigns();
      if(store.db){try{dcol().doc(id).delete().catch(function(){})}catch(x){}}
      if(plan.designId===id){plan.designId=undefined;save()}
      renderDesigns();dsgSay('Deleted.');
    }
  });

  // ----- Order list -----
  var HGT={base:860,drawer3:860,corner:860,sink:860,island:860,tall:2100,oven:2100,wall:700,fridge:1800,dish:850,wash:850,table:760};
  var SECT=[['Base units',['base','drawer3','corner','sink','island']],['Tall units',['tall','oven']],['Wall units',['wall','hood']],['Appliances',['hob','dish','wash','fridge']],['Other',['table']]];
  var APP_PARTS={none:{},oven:{oven:1},microonly:{micro:1},double:{oven:2},micro:{oven:1,micro:1},grill:{oven:1,grill:1},all:{oven:1,micro:1,grill:1}};
  var CNAME={
    cup:{'#e8ddc2':'Cream','#f2f2ef':'White','#bdbfc2':'Light grey','#55585c':'Graphite','#2f3e5a':'Navy','#a8b5a0':'Sage green','#3f5b47':'Forest green','#222325':'Black'},
    work:{'#5b5d60':'Charcoal','#2a2b2d':'Black granite','#e6e4df':'White marble','#b58b55':'Oak','#6b4a2f':'Walnut','#bfb8aa':'Light stone','#8b8d90':'Concrete grey'}
  };
  function cname(cat,hex){return CNAME[cat][String(hex).toLowerCase()]||('Custom '+String(hex).toUpperCase())}
  function orderData(){
    var groups={},parts={oven:0,micro:0,grill:0},runW=0,islandW=0,total=0,F=fin();
    plan.items.forEach(function(it){
      if(isOpen(it))return;
      total++;
      var a=isTallU(it)?appOf(it):'';
      var key=it.type+'|'+a+'|'+rnd(it.w)+'|'+rnd(it.d);
      if(!groups[key])groups[key]={type:it.type,app:a,w:rnd(it.w),d:rnd(it.d),qty:0};
      groups[key].qty++;
      if(['base','drawer3','corner','sink','dish','wash'].indexOf(it.type)>=0)runW+=it.w;
      if(it.type==='island')islandW+=it.w;
      if(a){var pp=APP_PARTS[a]||{};Object.keys(pp).forEach(function(k){parts[k]+=pp[k]})}
    });
    var sections=[];
    SECT.forEach(function(s){
      var rows=[];
      Object.keys(groups).forEach(function(k){
        var g=groups[k];if(s[1].indexOf(g.type)<0)return;
        var T=TYPES[g.type],name=T.name,note='';
        if(g.app){if(g.app==='none')name='Tall larder unit';else{name='Tall unit with '+APP[g.app].desc}}
        var h=HGT[g.type],size=g.w+' x '+g.d+(h?' x '+h:'');
        if(g.type==='hob'){size=g.w+' x '+g.d;note='Built in to worktop'}
        if(g.type==='hood'){note='Chimney to ceiling'}
        rows.push({qty:g.qty,name:name,size:size,note:note,sort:name});
      });
      rows.sort(function(a,b){return a.sort<b.sort?-1:1});
      if(rows.length)sections.push({title:s[0],rows:rows});
    });
    var ip=[];
    if(parts.oven)ip.push({qty:parts.oven,name:'Built-in oven',size:'',note:''});
    if(parts.micro)ip.push({qty:parts.micro,name:'Built-in microwave',size:'',note:''});
    if(parts.grill)ip.push({qty:parts.grill,name:'Built-in grill',size:'',note:''});
    if(ip.length)sections.push({title:'Integrated appliances (inside tall units)',rows:ip});
    var fin1=[
      'Cupboards: '+cname('cup',F.cup)+', '+(F.gloss?'gloss':'matt'),
      'Worktop: '+cname('work',F.work)
    ];
    if(runW)fin1.push('Worktop run along walls (approx.): '+rnd(runW)+' mm');
    if(islandW)fin1.push('Island worktop: '+rnd(islandW)+' mm wide');
    return {sections:sections,finish:fin1,total:total};
  }
  function orderText(){
    var d=orderData(),L=[];
    L.push('Mahmood Property Services - Order list');
    L.push('Project: '+(plan.name||'Kitchen plan'));
    L.push('Room: '+rnd(plan.W)+' x '+rnd(plan.D)+' mm');
    L.push('');
    d.finish.forEach(function(x){L.push(x)});
    d.sections.forEach(function(s){
      L.push('');L.push(s.title);
      s.rows.forEach(function(r){L.push(r.qty+' x '+r.name+(r.size?' ('+r.size+' mm)':'')+(r.note?' - '+r.note:''))});
    });
    L.push('');L.push('Total units and appliances: '+d.total);
    L.push('Sizes are width x depth x height in mm. Base unit height excludes the 40 mm worktop. Check all sizes before ordering.');
    return L.join('\n');
  }
  function renderOrder(){
    var d=orderData(),h='';
    h+='<div class="oh"><img src="'+R.querySelector('.bar img').src+'" alt="Mahmood Property Services"><div><h2>Order list</h2><p>'+esc(plan.name||'Kitchen plan')+'</p><p>Room '+rnd(plan.W)+' x '+rnd(plan.D)+' mm</p></div></div>';
    h+='<div class="of">'+d.finish.map(function(x){return '<div>'+esc(x)+'</div>'}).join('')+'</div>';
    if(!d.sections.length)h+='<p>Nothing on the plan yet. Add units and they will be listed here.</p>';
    d.sections.forEach(function(s){
      h+='<h3>'+esc(s.title)+'</h3><table><thead><tr><th class="q">Qty</th><th>Item</th><th class="z">Size (mm)</th></tr></thead><tbody>';
      s.rows.forEach(function(r){
        h+='<tr><td class="q">'+r.qty+'</td><td>'+esc(r.name)+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</td><td class="z">'+esc(r.size)+'</td></tr>';
      });
      h+='</tbody></table>';
    });
    h+='<p class="ot">Total units and appliances: '+d.total+'</p><p class="on">Sizes are width x depth x height. Base unit height excludes the 40 mm worktop. Check all sizes before ordering.</p>';
    $('#ordBody').innerHTML=h;
  }
  function ordSay(t){$('#ordMsg').textContent=t}
  function openOrder(){renderOrder();ordSay('');$('#ord').hidden=false;$('#ordBar').hidden=false;$('#ord').scrollTop=0}
  $('#ordBtn').addEventListener('click',openOrder);
  $('#ordClose').addEventListener('click',function(e){e.stopPropagation();$('#ord').hidden=true;$('#ordBar').hidden=true});
  $('#ordHide').addEventListener('click',function(e){e.stopPropagation();$('#ordBar').hidden=true});
  $('#ord').addEventListener('click',function(){if($('#ordBar').hidden&&!$('#ord').hidden)$('#ordBar').hidden=false});
  $('#ordShare').addEventListener('click',async function(e){
    e.stopPropagation();
    var text=orderText();
    try{
      if(navigator.share){await navigator.share({title:'Order list - '+(plan.name||'Kitchen plan'),text:text});return}
      if(navigator.clipboard){await navigator.clipboard.writeText(text);ordSay('Copied. Paste it into WhatsApp, a message or an email.');return}
    }catch(x){if(x&&x.name==='AbortError')return}
    ordSay('Sharing is not available here. Take a screenshot of the list instead.');
  });

  // ----- load -----
  function adopt(p){
    if(!p||typeof p!=='object'||!Array.isArray(p.items))return;
    plan={name:p.name||'',W:clamp(num(p.W)||4000,1500,15000),D:clamp(num(p.D)||3000,1500,15000),items:p.items.filter(function(i){return i&&(TYPES[i.type]||OPEN[i.type])}),autoTurn:p.autoTurn!==false,finish:(p.finish&&typeof p.finish==='object')?p.finish:{},designId:p.designId||undefined};
  }
  loadDesigns();
  try{adopt(JSON.parse(localStorage.getItem('mps_kitchen')||'null'))}catch(e){}
  syncRoomFields();renderAll();
  RB.__onShow=function(){renderAll()};
  (async function(){
    try{
      if(!window.claude)return;
      var u=await window.claude.use('user'),d=await window.claude.use('db');
      if(!u||!d)return;
      var id=await u.id();if(!id)return;
      store.db=d;store.uid=id;
      var all=await d.collection('data/users/'+id).get(),have={};
      all.docs.forEach(function(s){
        if(String(s.id).indexOf('dz_')!==0)return;
        var r=s.data();if(!r||!r.id)return;
        r=JSON.parse(JSON.stringify(r));have[r.id]=true;
        var i=-1;designs.forEach(function(x,n){if(x.id===r.id)i=n});
        if(i<0)designs.push(r);else if((r.savedAt||0)>(designs[i].savedAt||0))designs[i]=r;
      });
      designs.forEach(function(r){if(!have[r.id])putDesign(r)});
      persistDesigns();
      if(!$('#dsg').hidden)renderDesigns();
      var snap=await d.collection('data/users/'+id).doc('plan').get();
      var rec=snap&&snap.data?snap.data():null;
      if(rec&&rec.plan&&!plan.items.length){adopt(JSON.parse(JSON.stringify(rec.plan)));syncRoomFields();renderAll()}
      else if(plan.items.length||plan.name){save()}
    }catch(e){}
  })();
});

var TABIDS=['home', 'jobs', 'cust', 'pr', 'calc', 'inv', 'exp', 'kit'],HOSTS={},ROOTS={};
function showTab(id){
  if(!HOSTS[id])return;
  TABIDS.forEach(function(k){HOSTS[k].hidden=(k!==id)});
  document.querySelectorAll('[data-tab]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.tab===id)});
  try{localStorage.setItem('mps_tab',id)}catch(e){}
  window.scrollTo(0,0);
  var r=ROOTS[id];if(r&&r.__onShow)r.__onShow();
}
TABIDS.forEach(function(id){
  var host=document.createElement('div');host.className='mod';host.hidden=true;
  var sh=host.attachShadow({mode:'open'});
  sh.appendChild(document.getElementById('tpl-'+id).content.cloneNode(true));
  document.getElementById('mods').appendChild(host);
  HOSTS[id]=host;ROOTS[id]=sh.querySelector('.modroot');
  try{MODS[id](sh,ROOTS[id])}
  catch(e){var d=document.createElement('div');d.className='fail';d.textContent='This part could not start: '+(e&&e.message);sh.appendChild(d)}
});
document.querySelector('.hubnav nav').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)});
showTab('home');
</script>
<script>
if(!window.claude){
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
}
</script>
