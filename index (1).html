<style>
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --charcoal:#58595B;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  --hubh:calc(50px + env(safe-area-inset-top,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body)}
.hubnav{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:3px solid var(--gold);height:var(--hubh);
  padding:env(safe-area-inset-top,0px) 8px 0;display:flex;align-items:center;gap:8px}
.hubnav img{height:30px;width:auto;background:#fff;border-radius:4px;padding:2px 4px;display:none}
@media (min-width:520px){.hubnav img{display:block}}
.hubnav nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.hubnav nav::-webkit-scrollbar{display:none}
.hubnav button{flex:1 0 auto;border:0;background:transparent;color:var(--text);font-family:var(--head);font-size:16px;padding:9px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.hubnav button[aria-pressed="true"]{background:var(--gold);color:#1F1F21}
.mod[hidden]{display:none}
.fail{padding:24px;font-weight:600}
</style>

<template id="tpl-home"><style>
:host{display:block;
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --gold-deep:#8F6C13; --charcoal:#58595B; --danger:#B3261E; --ok:#2F7A4B; --warn:#9A6200;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
.modroot{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.hello h1{font-family:var(--head);font-weight:500;font-size:28px;margin:0}
.hello p{margin:0;color:var(--muted)}
.quick{display:flex;gap:8px;overflow-x:auto;margin:14px 0}
.quick button{flex:0 0 auto;border:1.5px solid var(--charcoal);background:var(--surface);border-radius:22px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:15px}
.quick button.p{background:var(--gold);border-color:var(--gold);color:#1F1F21}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;border-left:5px solid var(--line)}
.card .lbl{font-size:14px;font-weight:600;color:var(--muted)}
.card .val{font-family:var(--head);font-weight:500;font-size:30px;line-height:1.15;margin-top:2px}
.card .sub{font-size:13px;color:var(--muted)}
.card.gold{border-left-color:var(--gold)}
.card.green{border-left-color:var(--ok)}
.card.red{border-left-color:var(--danger)}
.card.red .val{color:var(--danger)}
.card.blue{border-left-color:#3B7BAA}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h2{font-family:var(--head);font-weight:500;font-size:21px;margin:0 0 8px}
.item{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{min-width:0}
.item .t small{display:block;color:var(--muted);font-size:13px}
.item .a{font-weight:700;white-space:nowrap}
.tag{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;margin-right:6px;background:var(--bg);border:1px solid var(--line)}
.tag.red{background:var(--danger);border-color:var(--danger);color:#fff}
.tag.amber{background:#F4E2B8;border-color:#E2C16F;color:#6B4A00}
.empty{color:var(--muted);margin:0}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.bars{display:flex;align-items:flex-end;gap:3px;height:112px;width:100%;justify-content:center}
.bar{width:42%;max-width:22px;border-radius:4px 4px 0 0;min-height:2px}
.bar.in{background:var(--gold)}
.bar.out{background:var(--charcoal)}
.col .m{font-size:13px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted);font-size:13px}
.row b{white-space:nowrap}
.cat{margin-bottom:9px}
.cat .t{display:flex;justify-content:space-between;font-size:15px}
.cat .track{height:8px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:3px}
.cat .fill{height:100%;background:var(--gold)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.bk{border:1.5px solid var(--charcoal);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:15px}
.bk.p{background:var(--gold);border-color:var(--gold);color:#1F1F21}
.bkc{border:2px solid var(--gold);background:#FBF4E0;border-radius:10px;padding:12px;margin-top:12px;font-size:15px}
.bkmsg{font-size:15px;margin:10px 0 0}
.bkmsg.bad{color:var(--danger);font-weight:600}
.okb{background:#DDEEE3;border:1px solid #B5D8C2;color:#1F5A37;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-weight:600}

.bar{top:var(--hubh,50px)!important}
.bar img,.bar h1{display:none!important}
.bar .hbtn{margin-left:auto}
</style><div class="modroot">
<main>
  <div class="okb" id="okBanner" hidden></div>
  <div class="hello"><h1 id="hi">Hello</h1><p id="date"></p></div>
  <div class="quick" id="quick"></div>
  <div class="cards" id="cards"></div>

  <section class="panel"><h2>Needs attention</h2><div id="attn"></div></section>
  <section class="panel"><h2>Coming up</h2><div id="next"></div></section>
  <section class="panel">
    <h2>Last six months</h2>
    <div class="chart" id="chart"></div>
    <div class="legend"><span><i style="background:var(--gold)"></i>Invoiced</span><span><i style="background:var(--charcoal)"></i>Spent</span></div>
  </section>
  <section class="panel"><h2>Business snapshot</h2><div id="snap"></div></section>
  <section class="panel"><h2>Where the money goes</h2><div id="cats"></div><p class="note" id="catNote"></p></section>
  <section class="panel" id="bkBox" hidden>
    <h2>Back up your data</h2>
    <p class="note" style="margin:0 0 10px">Your information is stored on this phone only. Save a backup file now and then, in case the phone is lost, reset or the browser data is cleared.</p>
    <div class="btns"><button type="button" class="bk p" id="bkSave">Save a backup file</button><button type="button" class="bk" id="bkRestore">Restore from a backup</button></div>
    <input type="file" id="bkFile" hidden>
    <div class="bkc" id="bkConfirm" hidden>
      <b id="bkSummary"></b>
      <p style="margin:6px 0 10px">Restoring replaces everything now on this phone with what is in this file.</p>
      <div class="btns"><button type="button" class="bk p" id="bkGo">Restore now</button><button type="button" class="bk" id="bkCancel">Cancel</button></div>
    </div>
    <p class="bkmsg" id="bkMsg" role="status"></p>
  </section>
  <p class="note">The numbers come from your Jobs, Invoices and Expenses tabs. An invoice only counts as paid once you mark it paid in the invoice History.</p>
</main>


</div></template>
<template id="tpl-jobs"><style>
:host{display:block;
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --gold-deep:#8F6C13; --charcoal:#58595B; --field:#FFFFFF; --danger:#B3261E;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  }
*,*::before,*::after{box-sizing:inherit}
.modroot{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--gold);
  display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar img{height:38px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px 4px}
.bar h1{font-family:var(--head);font-weight:500;font-size:24px;margin:0 0 0 auto}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.card .val{font-family:var(--head);font-size:24px;line-height:1.15;margin-top:2px}
.card.gold{border-left:5px solid var(--gold)}

.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--field)}
.f textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:16px;text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--gold);color:#1F1F21}
.btn.ghost{background:transparent;border:1.5px solid var(--charcoal);color:var(--text)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.small{padding:8px 12px;font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted);margin:4px 0 0}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--charcoal);border-color:var(--charcoal);color:#fff}
.chip small{opacity:.75;margin-left:4px}

.job{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;border-left:6px solid var(--line)}
.job[data-stage="enquiry"]{border-left-color:#8A8B8E}
.job[data-stage="quoted"]{border-left-color:#3B7BAA}
.job[data-stage="booked"]{border-left-color:#8F6C13}
.job[data-stage="progress"]{border-left-color:#C39A2D}
.job[data-stage="done"]{border-left-color:#C0622B}
.job[data-stage="paid"]{border-left-color:#3E7C4F}
.job .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job .who{font-weight:700;font-size:17px;min-width:0}
.job .what{color:var(--text);margin:1px 0 0}
.job .meta{color:var(--muted);font-size:14px;margin-top:3px}
.job .amt{font-family:var(--head);font-size:21px;white-space:nowrap}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;margin-right:6px;background:var(--bg);border:1px solid var(--line)}
.badge.late{background:var(--danger);color:#fff;border-color:var(--danger)}
.job .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{color:var(--muted);padding:18px 0;text-align:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:50;font-weight:600;max-width:90%;text-align:center}
#toast[hidden]{display:none}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 3px 10px rgba(0,0,0,.3);padding:14px 22px}

#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.55);overflow:auto}
#sheet[hidden]{display:none}
.sheet-in{background:var(--surface);max-width:560px;margin:0 auto;min-height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in h2{font-family:var(--head);font-weight:500;font-size:26px;margin:0 0 12px}
.err{color:var(--danger);font-weight:600;margin:6px 0}

.bar{top:var(--hubh,50px)!important}
.bar{display:none!important}

<template id="tpl-cust"><style>
:host{display:block;
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --gold-deep:#8F6C13; --charcoal:#58595B; --field:#FFFFFF; --danger:#B3261E; --ok:#2F7A4B;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
.modroot{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
.top{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:end}
.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--field)}
.f textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:16px;text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--gold);color:#1F1F21}
.btn.ghost{background:transparent;border:1.5px solid var(--charcoal);color:var(--text)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.small{padding:8px 12px;font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted);margin:4px 0 0}
.cust{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
.cust .n{font-weight:700;font-size:17px}
.cust .s{color:var(--muted);font-size:14px;margin-top:1px}
.cust .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.badge.red{background:var(--danger);border-color:var(--danger);color:#fff}
.badge.green{background:#DDEEE3;border-color:#B5D8C2;color:#1F5A37}
.empty{color:var(--muted);padding:18px 0;text-align:center}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 3px 10px rgba(0,0,0,.3);padding:14px 22px}
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.55);overflow:auto}
#sheet[hidden]{display:none}
.sheet-in{background:var(--surface);max-width:600px;margin:0 auto;min-height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in h2{font-family:var(--head);font-weight:500;font-size:26px;margin:0 0 10px}
.sheet-in h3{font-family:var(--head);font-weight:500;font-size:19px;margin:18px 0 6px;color:var(--charcoal)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-family:var(--head);font-weight:500;font-size:20px}
.stat small{color:var(--muted);font-size:13px}
.hist{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer}
.hist:last-child{border-bottom:0}
.hist .t{min-width:0}
.hist .t small{display:block;color:var(--muted);font-size:13px}
.hist .a{font-weight:700;white-space:nowrap;text-align:right}
.err{color:var(--danger);font-weight:600;margin:6px 0}

.bar{top:var(--hubh,50px)!important}
.bar img,.bar h1{display:none!important}
.bar .hbtn{margin-left:auto}

<template id="tpl-pr"><style>
:host{display:block;
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --gold-deep:#8F6C13; --charcoal:#58595B; --field:#FFFFFF; --danger:#B3261E; --ok:#2F7A4B; --warn:#9A6200;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  }
*,*::before,*::after{box-sizing:inherit}
.modroot{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--gold);
  display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar img{height:38px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px 4px}
.bar h1{font-family:var(--head);font-weight:500;font-size:22px;margin:0 0 0 auto}
.hbtn{border:1.5px solid var(--charcoal);background:transparent;border-radius:8px;padding:7px 12px;font-family:var(--head);font-size:16px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px 16px 150px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{font-family:var(--head);font-weight:500;font-size:21px;margin:0 0 8px}
details.panel>summary{cursor:pointer;font-family:var(--head);font-weight:500;font-size:21px;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary small{display:block;font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted)}
details.panel[open]>summary{margin-bottom:10px}
.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--field)}
.f textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:16px}
.btn.primary{background:var(--gold);color:#1F1F21}
.btn.ghost{background:transparent;border:1.5px solid var(--charcoal);color:var(--text)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.small{padding:7px 11px;font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted);margin:4px 0 0}
.check{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--gold)}

.line{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:end;margin-bottom:8px}
.line .f{margin:0}
.line .rm{border:0;background:transparent;color:var(--danger);font-weight:700;cursor:pointer;padding:10px 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:18px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}

table.bk{width:100%;border-collapse:collapse}
table.bk td{padding:7px 0;border-bottom:1px solid var(--line)}
table.bk td:last-child{text-align:right;white-space:nowrap}
table.bk tr.sub td{font-weight:700}
table.bk small{display:block;color:var(--muted);font-size:13px}
.note{border-radius:8px;padding:9px 12px;margin-top:10px;font-weight:600;font-size:15px}
.note.ok{background:rgba(47,122,75,.14);color:var(--ok)}
.note.warn{background:rgba(154,98,0,.16);color:var(--warn)}
.note.bad{background:rgba(179,38,30,.14);color:var(--danger)}

#total{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--charcoal);color:#fff;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#total .tt{flex:1 1 150px}
#total .tt small{display:block;opacity:.8;font-size:13px}
#total .tt strong{font-family:var(--head);font-size:30px;font-weight:500;line-height:1.1}
#total .btn{min-height:44px}
#total .btn.ghost{border-color:#fff;color:#fff}

#sv{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#sv[hidden]{display:none}
.svw{max-width:720px;margin:0 auto;padding:16px}
.svh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.svh h2{font-family:var(--head);font-weight:500;font-size:26px;margin:0}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.srow .t{font-family:var(--head);font-size:22px;text-align:right}
.srow .b{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.srow .b button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.srow .b button[data-a="del"]{color:var(--danger)}

.bar{top:var(--hubh,50px)!important}
.bar img,.bar h1{display:none!important}
.bar .hbtn{margin-left:auto}
</style><div class="modroot">

  <h1>Job pricing</h1>
  <button type="button" class="hbtn" id="svBtn">Saved</button>
</header>

<main>
  <details class="panel" id="ratesBox">
    <summary>Your rates <small id="ratesSum"></small></summary>
    <div class="row2">
      <label class="f"><span>Hourly rate (£)</span><input id="sRate" inputmode="decimal" autocomplete="off"></label>
      <label class="f"><span>Hours in a working day</span><input id="sHpd" inputmode="decimal" autocomplete="off"></label>
    </div>
    <div class="row3">
      <label class="f"><span>Materials markup (%)</span><input id="sMark" inputmode="decimal" autocomplete="off"></label>
      <label class="f"><span>Contingency (%)</span><input id="sCont" inputmode="decimal" autocomplete="off"></label>
      <label class="f"><span>Round price up to</span><select id="sRound"><option value="0">No rounding</option><option value="5">Next £5</option><option value="10">Next £10</option><option value="25">Next £25</option><option value="50">Next £50</option></select></label>
    </div>
    <label class="check"><input type="checkbox" id="sMarkEx"> Add the markup to extras too</label>
    <label class="f"><span>CIS deduction by the customer</span><select id="sCis"><option value="0">None</option><option value="20">20%</option><option value="30">30%</option></select></label>
    <p class="hint">Set these once. They are saved on this device and used for every job. Contingency covers things that take longer than planned.</p>
  </details>

  <section class="panel">
    <h2>The job</h2>
    <label class="f"><span>Customer or job name</span><input id="jName" autocomplete="off" placeholder="e.g. Mrs Khan, kitchen door"></label>
    <div class="row3">
      <label class="f"><span>Time needed</span><input id="jTime" inputmode="decimal" autocomplete="off" placeholder="0"></label>
      <label class="f"><span>In</span><select id="jUnit"><option value="h">Hours</option><option value="d">Days</option></select></label>
      <label class="f"><span>Workers</span><input id="jWork" inputmode="numeric" autocomplete="off"></label>
    </div>
    <p class="hint" id="timeHint"></p>
  </section>

  <section class="panel">
    <h2>Materials</h2>
    <div id="mats"></div>
    <button type="button" class="btn ghost small" id="addMat">Add material</button>
    <p class="hint">Enter what you pay. The markup is added for you.</p>
  </section>

  <section class="panel">
    <h2>Extras</h2>
    <div class="chips" id="exChips"></div>
    <div id="exs"></div>
    <button type="button" class="btn ghost small" id="addEx">Add extra</button>
    <p class="hint">Fuel, skips, tool hire, a subcontractor or anything else it costs you.</p>
  </section>

  <section class="panel">
    <h2>Tax</h2>
    <label class="check"><input type="checkbox" id="jVat"> Add VAT at 20%</label>
  </section>

  <section class="panel">
    <h2>Price breakdown</h2>
    <table class="bk" id="bk"></table>
    <div id="notes"></div>
  </section>

  <section class="panel" id="toJobsBox" hidden>
    <h2>Next step</h2>
    <button type="button" class="btn primary" id="toJobs">Send to Jobs as a quote</button>
    <p class="hint" id="toJobsMsg" role="status"></p>
  </section>

  <section class="panel">
    <h2>Notes</h2>
    <label class="f" style="margin:0"><textarea id="jNotes" placeholder="Assumptions, what is included, access"></textarea></label>
  </section>

  <div class="btns"><button type="button" class="btn ghost" id="newJob">Start a new price</button></div>
</main>

<div id="total">
  <div class="tt"><small id="totLbl">Quote price</small><strong id="totVal">£0.00</strong></div>
  <button type="button" class="btn primary" id="saveBtn">Save</button>
  <button type="button" class="btn ghost" id="shareBtn">Share</button>
</div>

<div id="sv" hidden>
  <div class="svw">
    <div class="svh"><h2>Saved prices</h2><button type="button" class="btn ghost" id="svClose">Close</button></div>
    <p class="hint" id="svMsg" role="status" style="margin:0 0 8px"></p>
    <label class="f"><span>Search</span><input id="svQ" placeholder="Customer or job name" autocomplete="off"></label>
    <div id="svList"></div>
  </div>
</div>

:host{display:block;
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --gold-deep:#8F6C13; --charcoal:#58595B; --field:#FFFFFF; --danger:#B3261E;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;

  box-sizing:border-box;
}

.modroot{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}

<template id="tpl-inv"><style>
:host{display:block;
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --gold-deep:#8F6C13; --charcoal:#58595B; --field:#FFFFFF; --danger:#B3261E;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  }
*,*::before,*::after{box-sizing:inherit}
.modroot{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--gold);
  display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.bar img{height:38px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px 4px}
.seg{display:inline-flex;border:1.5px solid var(--charcoal);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:transparent;padding:8px 16px;font-family:var(--head);font-size:17px;cursor:pointer;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--charcoal);color:#fff}
.tabs{display:none;width:100%;gap:8px}
.tabs button{flex:1;padding:9px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:#1F1F21}

main{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:16px;max-width:1280px;margin:0 auto}
@media (min-width:1000px){main{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}}
@media (max-width:999px){
  .tabs{display:flex}
  .modroot[data-view="edit"] #previewCol{display:none}
  .modroot[data-view="preview"] #editCol{display:none}
}

/* form */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{font-family:var(--head);font-weight:500;font-size:22px;margin:0 0 10px;color:var(--text)}
.panel h2 small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--field)}
.f textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1.5px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--bg)}
.item .f{margin-bottom:8px}
.item .grid{display:grid;grid-template-columns:1.2fr .8fr 1fr auto;gap:8px;align-items:end}
.item .grid .f{margin:0}
.item .del{border:0;background:transparent;color:var(--danger);font-weight:600;padding:10px 4px;cursor:pointer}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:16px}
.btn.primary{background:var(--gold);color:#1F1F21}
.btn.ghost{background:transparent;border:1.5px solid var(--charcoal);color:var(--text)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.total-live{font-family:var(--head);font-size:26px}

/* paper */
.paper-wrap{overflow-x:auto}
#paper{background:#fff;color:#222;width:100%;max-width:794px;min-width:560px;margin:0 auto;padding:40px 44px;border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:14px;line-height:1.45}
#paper .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:4px solid #C39A2D;padding-bottom:18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#paper .top img{height:78px;width:auto;display:block}
#paper .doc-title{text-align:right}
#paper .doc-title h1{font-family:var(--head);font-weight:500;font-size:44px;line-height:1;margin:0 0 8px;color:#58595B}
#paper .doc-title p{margin:1px 0;color:#444}
#paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:22px 0}
#paper .parties h3{font-family:var(--head);font-weight:500;font-size:16px;margin:0 0 4px;color:#58595B}
#paper .parties p{margin:1px 0;white-space:pre-line}
#paper table{width:100%;border-collapse:collapse;margin-top:6px}
#paper th{font-family:var(--head);font-weight:500;font-size:15px;text-align:left;color:#fff;background:#58595B;padding:8px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#paper th.n,#paper td.n{text-align:right;white-space:nowrap}
#paper td{padding:9px 10px;border-bottom:1px solid #E4E2DC;vertical-align:top}

#paper .empty td{color:#888;text-align:center;padding:22px}
#paper .totals{margin:16px 0 0 auto;width:min(320px,100%)}
#paper .totals div{display:flex;justify-content:space-between;padding:5px 10px}
#paper .totals .due{background:#C39A2D;color:#1F1F21;font-family:var(--head);font-size:22px;margin-top:6px;padding:9px 10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#paper .foot{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
#paper .foot h3{font-family:var(--head);font-weight:500;font-size:16px;margin:0 0 4px;color:#58595B}
#paper .foot p{margin:0;white-space:pre-line}
#paper .thanks{margin-top:28px;text-align:center;color:#58595B;font-family:var(--head);font-size:17px;border-top:1px solid #E4E2DC;padding-top:12px}

      <label class="f"><span>Property address</span><textarea data-s="doc" data-k="custAddr" placeholder="Address of the job"></textarea></label>

    <section class="panel">

      <div class="row2">
        <label class="f"><span>Phone</span><input data-s="biz" data-k="phone" type="tel" autocomplete="off"></label>
        <label class="f"><span>Email</span><input data-s="biz" data-k="email" type="email" autocomplete="off"></label>
      </div>

<template id="tpl-exp"><style>
:host{display:block;
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --gold-deep:#8F6C13; --charcoal:#58595B; --field:#FFFFFF; --danger:#B3261E;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  }
*,*::before,*::after{box-sizing:inherit}
.modroot{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--gold);
  display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar img{height:38px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px 4px}
.bar h1{font-family:var(--head);font-weight:500;font-size:24px;margin:0 0 0 auto}
main{max-width:720px;margin:0 auto;padding:16px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .lbl{font-size:14px;font-weight:600;color:var(--muted)}
.card .val{font-family:var(--head);font-size:30px;line-height:1.15;margin-top:2px}
.card.gold{border-left:5px solid var(--gold)}

.toolbar{display:flex;gap:10px;align-items:end;margin-bottom:14px}
.toolbar .f{flex:1;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{font-family:var(--head);font-weight:500;font-size:22px;margin:0 0 10px}
.f{display:block;margin-bottom:10px}
.f span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--field)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:16px}
.btn.primary{background:var(--gold);color:#1F1F21}
.btn.ghost{background:transparent;border:1.5px solid var(--charcoal);color:var(--text)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted);margin:4px 0 0}

.bars .b{margin-bottom:9px}
.bars .t{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bars .track{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:3px}
.bars .fill{height:100%;background:var(--gold);border-radius:5px}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.month{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--gold)}
.month h3{font-family:var(--head);font-weight:500;font-size:19px;margin:0}
.month span{font-weight:700}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.ex .d{font-weight:600;color:var(--muted);font-size:14px;min-width:46px}
.ex .m{min-width:0}
.ex .m strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex .m small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex .a{font-weight:700;white-space:nowrap}
.empty{color:var(--muted);padding:14px 0}

#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.55);overflow:auto}
#sheet[hidden]{display:none}
.sheet-in{background:var(--surface);max-width:560px;margin:0 auto;min-height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in h2{font-family:var(--head);font-weight:500;font-size:26px;margin:0 0 12px}
.thumb{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block;margin:6px 0}
.err{color:var(--danger);font-weight:600;margin:6px 0}
#msg{margin:0 0 10px}
.filebtn{display:inline-block;cursor:pointer;text-align:center}
#camV{width:100%;max-height:300px;background:#000;border-radius:8px;object-fit:cover;display:block}

.bar{top:var(--hubh,50px)!important}
.bar{display:none!important}
</style><div class="modroot">

  <h1>Expenses</h1>
</header>

<main>
  <div class="cards">
    <div class="card"><div class="lbl" id="monthLbl">This month</div><div class="val" id="monthVal">£0.00</div></div>
    <div class="card gold"><div class="lbl" id="yearLbl">Tax year</div><div class="val" id="yearVal">£0.00</div></div>
  </div>

  <div class="toolbar">
    <label class="f"><span>Tax year (6 April to 5 April)</span><select id="taxYear"></select></label>
    <button type="button" class="btn primary" id="add">Add expense</button>
  </div>

  <section class="panel">
    <h2>Where the money goes</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel">
    <h2>All expenses</h2>
    <div class="filters">
      <label class="f"><span>Category</span><select id="fCat"></select></label>
      <label class="f"><span>Search</span><input id="fQ" placeholder="Job, supplier or note" autocomplete="off"></label>
    </div>
    <div id="list"></div>
  </section>

  <section class="panel">
    <h2>Send to your accountant</h2>
    <p class="hint" style="margin:0 0 10px">Sends the expenses shown for the chosen tax year as a simple list you can paste into a spreadsheet.</p>
    <div class="btns">
      <button type="button" class="btn primary" id="shareBtn">Share list</button>
      <button type="button" class="btn ghost" id="csvBtn">Save as CSV file</button>
    </div>
    <p class="hint" id="msg" role="status"></p>
  </section>
</main>

<div id="sheet" hidden>
  <div class="sheet-in">
    <h2 id="sheetTitle">Add expense</h2>
    <div class="row2">
      <label class="f"><span>Date</span><input type="date" id="eDate"></label>
      <label class="f"><span>Amount (£)</span><input id="eAmt" inputmode="decimal" placeholder="0.00" autocomplete="off"></label>
    </div>
    <label class="f"><span>Category</span><select id="eCat"></select></label>
    <label class="f"><span>Job or customer (optional)</span><input id="eJob" list="jobs" autocomplete="off" placeholder="e.g. Mrs Khan kitchen"><datalist id="jobs"></datalist></label>
    <label class="f"><span>What was it for? Supplier or note</span><input id="eNote" autocomplete="off" placeholder="e.g. Screwfix, screws and sealant"></label>
    <div id="photoTools">
    <div class="f"><span>Receipt photo (optional)</span>
      <div class="btns">
        <label class="btn ghost filebtn">Take photo<input type="file" id="ePhotoCam" accept="image/*" capture="environment" hidden></label>
        <label class="btn ghost filebtn">Choose photo<input type="file" id="ePhoto" accept="image/*" hidden></label>
        <button type="button" class="btn ghost" id="eLive">Use camera here</button>
      </div>
      <p class="hint" id="phHint">If a button does nothing, check the camera permission for this app in your phone settings. You can still save the expense without a photo.</p>
    </div>
    <div id="camBox" hidden>
      <video id="camV" playsinline muted autoplay></video>
      <div class="btns" style="margin-top:8px"><button type="button" class="btn primary" id="camSnap">Capture receipt</button><button type="button" class="btn ghost" id="camStop">Cancel</button></div>
    </div>
    </div>
    <p class="hint" id="claudeNote" hidden>Have a receipt? Photograph it and send it to Claude in the chat. Claude will add the expense for you.</p>
    <div id="photoBox"></div>
    <p class="err" id="eErr" role="alert"></p>
    <div class="btns">
      <button type="button" class="btn primary" id="eSave">Save</button>
      <button type="button" class="btn ghost" id="eCancel">Cancel</button>
      <button type="button" class="btn danger" id="eDel" hidden>Delete</button>
    </div>
  </div>
</div>


</div></template>
<template id="tpl-kit"><style>
:host{display:block;
  --bg:#F6F6F4; --surface:#FFFFFF; --text:#2A2A2C; --muted:#6B6C70; --line:#DDDBD5;
  --gold:#C39A2D; --gold-deep:#8F6C13; --charcoal:#58595B; --field:#FFFFFF; --danger:#B3261E; --warn:#9A6200;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  }
*,*::before,*::after{box-sizing:inherit}
.modroot{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--gold);
  display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar img{height:38px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px 4px}
.bar h1{font-family:var(--head);font-weight:500;font-size:21px;margin:0 0 0 auto}
.hbtn{border:1.5px solid var(--charcoal);background:transparent;border-radius:8px;padding:7px 12px;font-family:var(--head);font-size:16px;cursor:pointer}
#ord{position:fixed;top:0;left:0;right:0;bottom:0;z-index:66;background:#fff;color:#222;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0}
#ord[hidden],#ordBar[hidden]{display:none}
#ord .oh{display:flex;align-items:center;gap:12px;border-bottom:4px solid #C39A2D;padding-bottom:8px;margin-bottom:10px}
#ord .oh img{height:46px;width:auto}
#ord .oh div{margin-left:auto;text-align:right}
#ord .oh h2{font-family:var(--head);font-weight:500;font-size:24px;margin:0;color:#58595B}
#ord .oh p{margin:0;font-size:14px;color:#444}
#ord .of{background:#F6F3EA;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:15px}
#ord .of div{padding:2px 0}
#ord h3{font-family:var(--head);font-weight:500;font-size:20px;margin:16px 0 4px;color:#58595B}
#ord table{width:100%;border-collapse:collapse;font-size:15px}
#ord th{background:#58595B;color:#fff;text-align:left;padding:6px 8px;font-family:var(--head);font-weight:500}
#ord td{padding:8px;border-bottom:1px solid #E4E2DC;vertical-align:top}
#ord .q{width:46px;text-align:center;font-weight:700}
#ord .z{text-align:right;white-space:nowrap}
#ord td small{display:block;color:#6B6C70;font-size:13px}
#ord .ot{font-weight:700;margin:14px 0 4px}
#ord .on{font-size:13px;color:#6B6C70;margin:0}
#ordBar{position:fixed;left:0;right:0;bottom:0;z-index:67;background:#222;color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ordBar p{margin:0;flex:1 1 100%;font-size:14px;min-height:0}
#ordBar p:empty{display:none}
#ordBar button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer;background:#444;color:#fff;min-height:44px}
#ordBar .go{background:#C39A2D;color:#1F1F21}
#dsg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:65;background:var(--bg);color:var(--text);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#dsg[hidden]{display:none}
.dwrap{max-width:720px;margin:0 auto;padding:16px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.dhead h2{font-family:var(--head);font-weight:500;font-size:26px;margin:0}
.drow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:110px 1fr;gap:6px 12px}
.drow .dmain strong{font-size:17px}
.drow .dbtns{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.drow .dbtns button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.drow .dbtns button[data-a="del"]{color:var(--danger)}
.badge{display:inline-block;background:var(--gold);color:#1F1F21;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;vertical-align:middle}
main{max-width:900px;margin:0 auto;padding:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{font-family:var(--head);font-weight:500;font-size:21px;margin:0 0 8px}
.f{display:block;margin-bottom:8px}
.f span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--field)}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:15px}
.btn.primary{background:var(--gold);color:#1F1F21}
.btn.ghost{background:transparent;border:1.5px solid var(--charcoal);color:var(--text)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted);margin:4px 0 0}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;min-width:104px}
.chip strong{display:block;font-size:15px}
.chip small{color:var(--muted);font-size:13px}
.chip.open{border-color:var(--charcoal)}
.sep{flex:0 0 2px;background:var(--gold);border-radius:1px;margin:2px 2px}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1.5px solid var(--charcoal);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--charcoal);color:#fff}
.tools .push{margin-left:auto}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--gold)}

#canvasWrap{background:#fff;border:1.5px solid var(--line);border-radius:10px;overflow:auto;max-height:62vh}
#plan{display:block;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.itm{touch-action:none;cursor:grab}
#plan text{pointer-events:none;font-family:var(--body)}

.warn{color:var(--danger);font-weight:600;margin:3px 0}
.ok{color:var(--muted);margin:0}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border-bottom:0}

#v3{position:fixed;top:0;left:0;right:0;bottom:0;z-index:55;background:#EFECE5}
#v3[hidden],#v3bar[hidden]{display:none}
#v3c{display:block;touch-action:none;width:100%;height:100%}
#v3bar{position:fixed;left:0;right:0;bottom:0;background:#222;color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#v3bar p{margin:0;font-size:13px}
#v3bar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#v3bar button{border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px;cursor:pointer;background:#444;color:#fff;min-height:40px}
#v3bar [hidden]{display:none!important}
#v3bar .row{gap:6px}
#v3bar .go{background:#C39A2D;color:#1F1F21}
#v3bar label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-right:auto}
#v3bar #v3col{display:flex;flex-direction:column;gap:8px}
#v3bar .cats{display:flex;gap:6px;overflow-x:auto}
#v3bar .catb{flex:0 0 auto;min-height:40px;padding:6px 12px}
#v3bar [aria-pressed="true"]{background:#C39A2D;color:#1F1F21}
#v3bar .sws{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:2px 0}
#v3bar button.sw{flex:0 0 auto;width:40px;min-height:40px;height:40px;padding:0;border:2px solid #777;border-radius:8px}
#v3bar button.sw[aria-pressed="true"]{border:3px solid #C39A2D;outline:2px solid #fff}
#v3bar .cust{flex:0 0 auto;margin:0;font-size:14px}
#v3bar .cust input{width:44px;height:36px;padding:0;border:0;background:none}
#v3bar .ckl{margin:0;font-weight:600;font-size:14px}
#v3bar input{width:20px;height:20px;accent-color:#C39A2D}
#quick{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:3px solid var(--gold);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;overflow-x:auto}
#quick[hidden]{display:none}
#quick button{flex:0 0 auto;min-width:46px;min-height:46px;border:1.5px solid var(--charcoal);background:transparent;border-radius:8px;font-weight:700;cursor:pointer;font-size:17px;padding:0 10px}
#quick select{min-height:46px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);padding:0 6px}
#quick label{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--muted);flex:0 0 auto}
.modroot.hasQuick main{padding-bottom:96px}
#clean{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#222;z-index:50;overflow:auto;padding:12px}
#clean[hidden],#cleanBar[hidden]{display:none}
#clean .ch{display:flex;align-items:center;gap:12px;border-bottom:4px solid #C39A2D;padding-bottom:8px;margin-bottom:8px}
#clean .ch img{height:44px;width:auto}
#clean .ch div{margin-left:auto;text-align:right}
#clean .ch h2{font-family:var(--head);font-weight:500;font-size:22px;margin:0;color:#58595B}
#clean .ch p{margin:0;font-size:13px;color:#444}
#clean .cs{font-size:14px;margin-top:8px}
#clean .cs div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #E4E2DC}
#cleanBar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#222;color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#cleanBar p{margin:0;flex:1 1 100%;font-size:15px}
#cleanBar button{border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer}
#cleanBar .go{background:#C39A2D;color:#1F1F21}
#cleanBar .no{background:#444;color:#fff}

.bar{top:var(--hubh,50px)!important}
.bar img,.bar h1{display:none!important}
.bar .hbtn{margin-left:auto}

<script>
window.MPS={go:function(id){showTab(id)},
  // saves a file: through Claude when running inside it, otherwise as a normal download
  saveFile:async function(name,blob){
    try{
      if(window.claude){var dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});return 'saved'}}
    }catch(e){if(e&&e.code==='declined')return 'declined'}
    try{
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
      return 'saved';
    }catch(e){return 'failed'}
  }};
var MODS={};
MODS.home=(function(R,RB){
  var $=function(s){return R.querySelector(s)};
  var gbp0=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0});
  var gbp=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function M(){return window.MPS||{}}
  function jobs(){return (M().getJobs&&M().getJobs())||[]}
  function invoices(){return ((M().getInvoices&&M().getInvoices())||[]).filter(function(r){return r.type==='invoice'})}
  function customers(){return (M().getCustomers&&M().getCustomers())||[]}
  function expenses(){return (M().getExpenses&&M().getExpenses())||[]}
  function go(id){if(M().go)M().go(id)}
  function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
  function dayTxt(s){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
  function taxYearOf(s){var y=+s.slice(0,4);return s.slice(5)>='04-06'?y:y-1}
  function sum(list,fn){var t=0;list.forEach(function(r){t+=fn(r)||0});return t}

  function render(){
    var today=iso(new Date()),ty=taxYearOf(today),mk=today.slice(0,7);
    var J=jobs(),I=invoices(),E=expenses();
    var hr=new Date().getHours();
    $('#hi').textContent=(hr<12?'Good morning':hr<18?'Good afternoon':'Good evening');
    $('#date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    // jobs
    var booked=J.filter(function(r){return r.stage==='booked'}),prog=J.filter(function(r){return r.stage==='progress'});
    var quoted=J.filter(function(r){return r.stage==='quoted'}),enq=J.filter(function(r){return r.stage==='enquiry'});
    var done=J.filter(function(r){return r.stage==='done'});
    // invoices
    var unpaid=I.filter(function(r){return !r.paid}),paid=I.filter(function(r){return r.paid});
    var overdue=unpaid.filter(function(r){return r.due&&r.due<today});
    var paidYear=paid.filter(function(r){return r.date&&taxYearOf(r.date)===ty});
    var expYear=E.filter(function(r){return r.date&&taxYearOf(r.date)===ty});
    var expMonth=E.filter(function(r){return r.date&&r.date.slice(0,7)===mk});

    var cards=[
      {c:'gold',go:'jobs',l:'Active jobs',v:booked.length+prog.length,s:booked.length+' booked, '+prog.length+' in progress'},
      {c:'blue',go:'jobs',l:'Quotes out',v:quoted.length,s:gbp0.format(sum(quoted,function(r){return r.price}))+' waiting for a yes'},
      {c:'gold',go:'inv',l:'Unpaid invoices',v:gbp0.format(sum(unpaid,function(r){return r.total})),s:unpaid.length+(unpaid.length===1?' invoice':' invoices')},
      {c:overdue.length?'red':'green',go:'inv',l:'Overdue',v:gbp0.format(sum(overdue,function(r){return r.total})),s:overdue.length?overdue.length+' past the due date':'Nothing overdue'},
      {c:'green',go:'inv',l:'Paid this tax year',v:gbp0.format(sum(paidYear,function(r){return r.total})),s:paidYear.length+(paidYear.length===1?' paid invoice':' paid invoices')},
      {c:'gold',go:'exp',l:'Spent this month',v:gbp0.format(sum(expMonth,function(r){return r.amount})),s:gbp0.format(sum(expYear,function(r){return r.amount}))+' this tax year'}
    ];
    $('#cards').innerHTML=cards.map(function(x){
      return '<button type="button" class="card '+x.c+'" data-go="'+x.go+'"><div class="lbl">'+esc(x.l)+'</div><div class="val">'+esc(x.v)+'</div><div class="sub">'+esc(x.s)+'</div></button>';
    }).join('');

    // needs attention
    var at=[];
    overdue.slice().sort(function(a,b){return a.due<b.due?-1:1}).forEach(function(r){
      at.push({go:'inv',hist:1,t:'<span class="tag red">Overdue</span>'+esc(r.number)+' '+esc(r.custName||''),s:dayDiff(r.due,today)+' days past the due date',a:gbp.format(r.total||0)});
    });
    booked.filter(function(r){return r.date&&r.date<today}).forEach(function(r){
      at.push({go:'jobs',t:'<span class="tag amber">Past start date</span>'+esc(r.name||'Job'),s:(r.title||'Booked job')+', was due to start '+dayTxt(r.date),a:r.price?gbp0.format(r.price):''});
    });
    done.forEach(function(r){
      at.push({go:'jobs',t:'<span class="tag amber">Done</span>'+esc(r.name||'Job'),s:'Finished, waiting to be paid',a:r.price?gbp0.format(r.price):''});
    });
    quoted.filter(function(r){return r.updatedAt&&Date.now()-r.updatedAt>14*86400000}).forEach(function(r){
      at.push({go:'jobs',t:'<span class="tag">Follow up</span>'+esc(r.name||'Job'),s:'Quote sent over two weeks ago',a:r.price?gbp0.format(r.price):''});
    });
    enq.filter(function(r){return r.updatedAt&&Date.now()-r.updatedAt>5*86400000}).forEach(function(r){
      at.push({go:'jobs',t:'<span class="tag">Reply</span>'+esc(r.name||'Enquiry'),s:'Enquiry waiting over five days',a:''});
    });
    $('#attn').innerHTML=at.length?at.slice(0,8).map(function(x){
      return '<button type="button" class="item" data-go="'+x.go+'"'+(x.hist?' data-hist="1"':'')+'><div class="t">'+x.t+'<small>'+esc(x.s)+'</small></div><div class="a">'+esc(x.a)+'</div></button>';
    }).join('')+(at.length>8?'<p class="note">And '+(at.length-8)+' more.</p>':''):'<p class="empty">Nothing needs attention right now.</p>';

    // coming up
    var up=booked.filter(function(r){return !r.date||r.date>=today}).concat(prog).sort(function(a,b){
      if(a.date&&b.date)return a.date<b.date?-1:1;
      if(a.date)return -1;if(b.date)return 1;return 0;
    });
    $('#next').innerHTML=up.length?up.slice(0,5).map(function(r){
      return '<button type="button" class="item" data-go="jobs"><div class="t">'+esc(r.name||'Job')+'<small>'+esc(r.title||'')+'</small></div><div class="a">'+(r.date?esc(dayTxt(r.date)):'<span class="tag">In progress</span>')+'</div></button>';
    }).join(''):'<p class="empty">No upcoming jobs. Booked jobs with a start date show here.</p>';

    // last six months
    var months=[],i;
    for(i=5;i>=0;i--){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push({k:iso(d).slice(0,7),l:d.toLocaleDateString('en-GB',{month:'short'}),inv:0,out:0})}
    I.forEach(function(r){if(!r.date)return;months.forEach(function(m){if(m.k===r.date.slice(0,7))m.inv+=r.total||0})});
    E.forEach(function(r){if(!r.date)return;months.forEach(function(m){if(m.k===r.date.slice(0,7))m.out+=r.amount||0})});
    var mx=Math.max.apply(null,months.map(function(m){return Math.max(m.inv,m.out)}).concat([1]));
    $('#chart').innerHTML=months.map(function(m){
      return '<div class="col"><div class="bars"><div class="bar in" style="height:'+Math.max(2,Math.round(m.inv/mx*110))+'px" title="Invoiced '+gbp0.format(m.inv)+'"></div><div class="bar out" style="height:'+Math.max(2,Math.round(m.out/mx*110))+'px" title="Spent '+gbp0.format(m.out)+'"></div></div><div class="m">'+esc(m.l)+'</div></div>';
    }).join('');

    // snapshot
    var wonStages=['booked','progress','done','paid'],won=J.filter(function(r){return wonStages.indexOf(r.stage)>=0}).length;

});
MODS.jobs=(function(R,RB){
  var $=function(s){return R.querySelector(s)};
  var gbp=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:2});

  var data=[],store={db:null,uid:null},editing=null,filter='active',linkCust='',toastT=null;

  // ---------- storage ----------

  function loadLocal(){try{var d=JSON.parse(localStorage.getItem('mps_jobs')||'[]');if(Array.isArray(d))data=d}catch(e){data=[]}}
  function col(){return store.db.collection('data/users/'+store.uid)}
  function putDb(r){if(store.db){try{col().doc(r.id).set(r).catch(function(){})}catch(e){}}}
  function delDb(id){if(store.db){try{col().doc(id).delete().catch(function(){})}catch(e){}}}
  async function initStore(){

      if(!window.claude)return;

    }catch(e){}
  }

  // ---------- helpers ----------

  function waHref(p){
    var d=String(p||'').replace(/[^\d+]/g,'');
    if(d.charAt(0)==='+')d=d.slice(1);else if(d.charAt(0)==='0')d='44'+d.slice(1);
    return 'https://wa.me/'+d;

        if(ad&&bd&&ad!==bd)return ad<bd?-1:1;

    });

        (meta.length?'<div class="meta">'+esc(meta.join('. '))+'</div>':'')+
        '<div class="acts"><button type="button" class="btn ghost small" data-a="edit">Open</button>'+
        (nx?'<button type="button" class="btn primary small" data-a="next">Mark as '+esc(nx[1].toLowerCase())+'</button>':'')+'</div></div>';
    }).join('');
  }

  // ---------- sheet ----------

    if(r&&custAvail()&&r.customerId&&r.customerId!=='x'&&window.MPS.cust.get(r.customerId))h+='<button type="button" class="btn ghost small" data-cust="1">View customer</button>';
    if(r)h+='<button type="button" class="btn ghost small" data-doc="invoice">Create invoice</button><button type="button" class="btn ghost small" data-doc="quote">Create quote</button>';
    $('#contactBtns').innerHTML=h;

  function toast(x){var el=$('#toast');el.textContent=x;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},3500)}

  }
